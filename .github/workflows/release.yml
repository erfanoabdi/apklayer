# Binary releases (docs/RELEASES.md): a tag vX.Y.Z on main builds the debs (OS release x CPU) and the Android runtime bundle, makes the
# GitHub Release and adds it to releases.json on the pages branch. Run by hand (workflow_dispatch) it is a dry run: it builds and
# shows the releases.json entry, nothing is released.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version the dry run builds (X.Y.Z)
        default: 0.0.0
        required: true
      prebuilts:
        description: ref of the prebuilts branch to build from
        default: prebuilts
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}  # vX.Y.Z on a tag; the v is dropped below
  PREBUILTS_REF: ${{ github.event_name == 'push' && format('prebuilts-{0}', github.ref_name) || inputs.prebuilts }}
  BUNDLE_CPUS: arm64 x86_64  # x86_64: the prebuilts' x86_64 part (2026-11-04 tree build; runs the suite on the owner's PC); experimental like the amd64 debs

jobs:
  guard:
    # fails before any build when tools/release/versions' runtime was already released from other prebuilts (check-runtime.py)
    runs-on: ubuntu-24.04
    outputs:
      prebuilts: ${{ steps.check.outputs.prebuilts }}
    steps:
      - uses: actions/checkout@v4
        with: {path: src}
      - name: Runtime version vs prebuilts commit
        id: check
        working-directory: src
        run: |
          git fetch -q --depth=1 --filter=blob:none origin "$PREBUILTS_REF"
          commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          git fetch -q --depth=1 origin pages
          git show FETCH_HEAD:releases.json > ../releases.json
          git ls-remote origin 'refs/tags/prebuilts-v*' > ../prebuilts-tags
          python3 tools/release/check-runtime.py ../releases.json . "$commit" ../prebuilts-tags
          echo "prebuilts=$commit" >> "$GITHUB_OUTPUT"

  deb:
    name: deb ${{ matrix.os.codename }} ${{ matrix.cpu.arch }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - {codename: noble, image: 'ubuntu:24.04'}
          - {codename: trixie, image: 'debian:trixie'}
        cpu:
          - {arch: arm64, runner: ubuntu-24.04-arm, experimental: false}
          - {arch: amd64, runner: ubuntu-24.04, experimental: true}  # never run on x86_64 hardware (docs/X86_64.md)
    needs: guard
    runs-on: ${{ matrix.cpu.runner }}
    continue-on-error: ${{ matrix.cpu.experimental }}
    container: ${{ matrix.os.image }}
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates curl dpkg-dev zstd >/dev/null
      - uses: actions/checkout@v4
        with: {path: src}
      - uses: actions/checkout@v4
        with: {path: prebuilts, ref: '${{ needs.guard.outputs.prebuilts }}'}
      - name: Build-Depends
        run: DEBIAN_FRONTEND=noninteractive apt-get build-dep -y -qq ./src >/dev/null
      - name: Build
        run: sh src/tools/release/build-deb.sh ${{ matrix.os.codename }} "${VERSION#v}" prebuilts out
      - uses: actions/upload-artifact@v4
        with: {name: 'deb-${{ matrix.os.codename }}-${{ matrix.cpu.arch }}', path: out/*.deb, if-no-files-found: error}

  flatpak:
    # the Flatpak bundle of each CPU (flatpak/build.sh, docs/INSTALL.md "Flatpak"); new: a failed build does not hold the release back
    name: flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: aarch64, runner: ubuntu-24.04-arm}
          - {arch: x86_64, runner: ubuntu-24.04}
    needs: guard
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: {path: src}
      - uses: actions/checkout@v4
        with: {path: prebuilts, ref: '${{ needs.guard.outputs.prebuilts }}'}
      - name: flatpak-builder
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq flatpak flatpak-builder >/dev/null
      - name: Build
        run: sh src/flatpak/build.sh prebuilts out "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with: {name: 'flatpak-${{ matrix.arch }}', path: out/*.flatpak, if-no-files-found: error}

  bundle:
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {path: src}
      - uses: actions/checkout@v4
        with: {path: prebuilts, ref: '${{ needs.guard.outputs.prebuilts }}'}
      - name: Runtime bundle
        run: for cpu in $BUNDLE_CPUS; do sh src/tools/release/runtime-bundle.sh prebuilts "$cpu" out; done
      - uses: actions/upload-artifact@v4
        with: {name: runtime, path: out/apklayer-runtime-*, if-no-files-found: error}

  release:
    needs: [guard, deb, bundle, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # the GitHub Release and the pages branch commit
    steps:
      - uses: actions/checkout@v4
        with: {path: src}
      - uses: actions/checkout@v4
        with: {path: pages, ref: pages}
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: SHA256SUMS
        # GitHub would rename the debs' ~ (apklayer_X.Y.Z-1~noble1_arm64.deb) to . in asset names: do it here, so the names below are the URLs
        run: cd dist && for f in *~*; do [ -e "$f" ] || continue; mv "$f" "${f//\~/.}"; done && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS . && cat SHA256SUMS
      - name: releases.json
        run: python3 src/tools/release/releases-json.py pages/releases.json "${VERSION#v}" dist "$GITHUB_REPOSITORY" src "${{ needs.guard.outputs.prebuilts }}"
      - name: GitHub Release
        if: github.event_name == 'push'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "apklayer ${VERSION#v}" --verify-tag \
            --notes "Install: download the deb for your OS and CPU, \`sudo apt install ./apklayer_*.deb\`, then open apklayer-manager. Flatpak: \`flatpak install --user apklayer-*-<cpu>.flatpak\` (docs/INSTALL.md \"Flatpak\": binderfs is a host step). apklayer-dev_*.deb: the headers for out-of-tree hardware plugins (docs/PLUGINS.md). SHA256SUMS lists every file."
      - name: Publish releases.json
        if: github.event_name == 'push'
        working-directory: pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add releases.json
          git commit -m "releases.json: ${VERSION#v}"
          git push origin HEAD:pages
