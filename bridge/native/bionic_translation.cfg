# apklayer's library mappings for bionic_translation (name Android code asks for -> file that answers). `tools/build cfg` writes these
# lines first, then the conditional ones, then bionic_translation's own cfg.d: the first line naming a library wins, so these replace
# upstream's. A name mapped to itself loads Android's own staged library instead of upstream's host stand-in.
# Android's libandroid.so (staged); upstream maps it to ATL's, which is not here
libandroid.so libandroid.so
# SurfaceTexture consumers and SurfaceFlinger's Choreographer/display services live in Android's libnativedisplay (staged)
libnativedisplay.so libnativedisplay.so
# bridge/ndk/libselinux.c with weak stubs for the rest of the real library
libselinux.so libapklayer_selinux.so
# Android's GLES trampolines dispatch through a hook table that Android's own libEGL stores in a thread-pointer slot; with our libEGL
# nothing fills it, so every GLES library is the host's (glvnd) instead
libGLESv1_CM.so libGLESv1_CM.so.1
