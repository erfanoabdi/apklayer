# Meson cross file of the 32-bit app process's native parts (tools/armhf/build.sh): Debian's armhf cross compiler and multiarch libraries
[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'arm-linux-gnueabihf-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[built-in options]
# bionic's arm32 ABI has a 32-bit time_t: Ubuntu's armhf compiler defaults to _TIME_BITS=64, which would make bionic_translation's
# wrappers and the shim hand glibc's 64-bit time structures to bionic code
c_args = ['-U_TIME_BITS']
cpp_args = ['-U_TIME_BITS']
