# Meson cross file of the 32-bit app process's native parts (tools/arm32/build.sh): Debian's armel cross compiler and multiarch libraries
[binaries]
c = 'arm-linux-gnueabi-gcc'
cpp = 'arm-linux-gnueabi-g++'
ar = 'arm-linux-gnueabi-ar'
strip = 'arm-linux-gnueabi-strip'
pkg-config = 'arm-linux-gnueabi-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv5te'
endian = 'little'

[built-in options]
# bionic's arm32 ABI has a 32-bit time_t: Debian's and Ubuntu's 32-bit builds move to _TIME_BITS=64, which would make bionic_translation's
# wrappers and the shim hand glibc's 64-bit time structures to bionic code
c_args = ['-U_TIME_BITS', '-march=armv7-a', '-mfloat-abi=softfp', '-mfpu=vfpv3-d16']
cpp_args = ['-U_TIME_BITS', '-march=armv7-a', '-mfloat-abi=softfp', '-mfpu=vfpv3-d16']
