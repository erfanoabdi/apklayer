# The test groups of tests/run. Each group runs in an apklayer instance of its own on the VM (binder devices, XDG_RUNTIME_DIR, window shell).
#   run    VM commands, in order, in the repo copy with the instance's environment; the group passes when all of them exit 0
#   mac    commands on the Mac instead (cwd: the repo)
#   apps   tests/apps/<name>, built on the Mac and installed once before any group starts
#   setup  VM commands run once before any group starts (files the groups' stacks read from APKLAYER_NATIVE)
#   needs  packages that must be installed already (user-supplied APKs: `bin/apklayer install <apk>` on the VM); missing: the group is skipped
#   alone  true: runs with no other group of the runner, after the parallel ones: real keys (uinput) go to the focused window, IBus and
#          the clipboard are the desktop's, and stacks that declare HAL services write their vintf manifests into the shared APKLAYER_NATIVE
#          (another stack removes them). Input into one app goes through its shell's test input (instance.inject), pixel checks use its own
#          SurfaceFlinger picture (apklayer screenshot): those groups run in parallel.
#   optional  true: only when named on the command line
# (the stacks of the HAL groups write their vintf manifests anew: removed first so that a hardlinked copy of APKLAYER_NATIVE gets new files)

[native]
run = ["meson test -C b --suite bionic --print-errorlogs"]

[native-bridge]
# an arm64-only JNI app: translated through the native bridge on x86_64 (Digitalis, docs/X86_64.md), native on arm64
apps = ["hello-arm64"]
run = ["tests/vm/native-bridge.sh"]

[arm32]
# an armeabi-v7a-only JNI app in the 32-bit app process (docs/PLAN.md "apps built for another CPU" 2(a)): needs a CPU that runs AArch32 code
# (the Volla X23; not the VMs on Apple Silicon) and the 32-bit runtime (tools/stage arm32, tools/armhf/build.sh, APKLAYER_ARM32)
apps = ["hello-arm32"]
run = ["tests/vm/arm32.sh"]
optional = true

[native-bridge-vulkan]
# hello-vulkan-arm64: vulkan-present's swapchain from an arm64-only library (the guest libvulkan proxy of the host's loader); needs a host
# Vulkan device that presents (the owner's x86 PC; native on arm64)
apps = ["hello-vulkan-arm64"]
run = ["python3 -u tests/vm/vulkan-present.py hello.vulkan.arm64 hello.vulkan.arm64.Main"]

[properties]
run = ["tests/vm/properties.sh"]

[install-verify]
run = ["tests/vm/install-verify.sh"]

[desktop-refresh]
run = ["tests/vm/desktop-refresh.sh"]

[dex2jvm]
# a class the converter fails on is installed as a stub that throws VerifyError (DexConverter.failedClassStub); the rest of the app runs
apps = ["hello-stub"]
run = ["tests/vm/dex2jvm-stub.sh"]

[reconvert]
run = ["tests/vm/reconvert.sh"]

[keystore]
apps = ["hello-keystore", "hello-keystore-other"]
run = ["tests/vm/keystore.sh", "python3 -u tests/vm/keystore-auth.py"]

[settings]
alone = true  # flips the desktop's colour scheme for a few seconds: every instance's apps follow it (their screenshots too)
apps = ["hello-settings"]
run = ["tests/vm/settings.sh"]

[devices]
apps = ["hello-devices"]
run = ["tests/vm/devices.sh"]

[camera]
apps = ["hello-camera"]
run = ["tests/vm/camera.sh", "python3 -u tests/vm/camera-portrait.py"]

[camera-pipewire]  # a camera node on the desktop's PipeWire (other instances' PipeWire backends see it while it runs)
apps = ["hello-camera"]
run = ["CAMERA_APP=1 tests/vm/camera-pipewire.sh"]
[bluetooth]
apps = ["hello-bluetooth"]
run = ["tests/vm/bluetooth.sh"]

[hardware]
# the hardware providers' fake backends (providers.toml): sensors, GNSS and vibrator over AIDL, then through Android's APIs
apps = ["hello-hardware"]
run = ["tests/vm/providers.sh"]

[hardware-host]
# the host backends of sensors and vibrator against mocks (iio-sensor-proxy, sensorfw, feedbackd over python-dbusmock; a uinput rumble device), each the default by probe()
apps = ["hello-hardware"]
run = ["tests/vm/providers-host.sh"]

[plugins]
# an out-of-tree hardware plugin (examples/plugin-vibrator-hello) built against the installed API, loaded from the plugin dir; another ABI refused
apps = ["hello-hardware"]
run = ["tests/vm/plugins.sh"]

[gnss]
# the GeoClue GNSS backend against a python-dbusmock GeoClue, and the hub's one GNSS client serving two apps at once (tests/vm/gnss.sh)
apps = ["hello-gps", "hello-gps2"]
run = ["tests/vm/gnss.sh"]

[usb]  # Gadget Zero over usbip on the machine itself (tests/vm/usb-gadget.sh: modprobe, a udev rule, usbipd): the attach, permission dialog, transfers
apps = ["hello-usb"]
run = ["tests/vm/usb.py"]
alone = true  # one usbip virtual device controller: usb and usb-serial take turns

[usb-serial]  # the serial gadget (CDC ACM) held by the host's cdc_acm: claimed with force, line coding, a line each way (tests/vm/usb-serial.py)
apps = ["hello-usb"]
run = ["tests/vm/usb-serial.py"]
alone = true

[permissions]  # the runtime permission prompt and role requests (HubPermissionPrompt): answers by test input, kept for the manager
apps = ["hello-permissions"]
run = ["python3 -u tests/vm/permissions.py", "python3 -u tests/vm/permission-mobile.py"]

[host-binder]
run = ["python3 tests/vm/host-binder.py"]  # libbinder's host context (frameworks/native 0006): a second instance plays the device

[files]
apps = ["hello-files"]
setup = ["""f=${APKLAYER_NATIVE:-$HOME/arm64-native}/android-root/system/etc/permissions/apklayer-test-hello-files.xml; [ -e $f ] || printf '<permissions><privapp-permissions package="hello.files"><permission name="android.permission.MANAGE_DOCUMENTS"/></privapp-permissions></permissions>\\n' > $f"""]
run = ["tests/vm/files.sh", "OWNDATA=1 tests/vm/files.sh", "VOLUMES=1 tests/vm/files.sh"]

[view]
apps = ["hello-files", "hello-reader"]
needs = ["com.android.externalstorage"]  # the linux-home documents provider
setup = ["""f=${APKLAYER_NATIVE:-$HOME/arm64-native}/android-root/system/etc/permissions/apklayer-test-hello-files.xml; [ -e $f ] || printf '<permissions><privapp-permissions package="hello.files"><permission name="android.permission.MANAGE_DOCUMENTS"/></privapp-permissions></permissions>\\n' > $f"""]
run = ["tests/vm/view.sh"]

[sysprov]
apps = ["hello-sysprov"]
needs = ["com.android.providers.settings", "com.android.providers.contacts", "com.android.providers.userdictionary"]
run = ["tests/vm/sysprov.sh"]

[host-uid]  # the desktop user's Linux uid >= 100000 (Sailfish OS's defaultuser is 100000): a user namespace maps this user to 100500, the settings scenario of sysprov runs in it
apps = ["hello-sysprov"]
needs = ["com.android.providers.settings"]
run = ["unshare --user --map-users=100500:$(id -u):1 --map-groups=100500:$(id -g):1 tests/vm/sysprov.sh settings"]

[system-apps]
apps = ["hello-system", "hello-accounts", "hello-accounts-hidden", "hello-rotated"]  # signing reads hello-rotated; the accounts scenario shows its account to the one and not the other
needs = ["com.android.providers.contacts", "com.android.documentsui"]
run = ["tests/vm/system-apps.sh"]

[first-start]
# a fresh data home of its own: the providers and DocumentsUI installed from the prebuilts' system-apps, then the first start (boot settings, Files stays up)
run = ["python3 -u tests/vm/first-start.py"]

[accounts]
apps = ["hello-system", "hello-accounts", "hello-accounts-hidden"]
run = ["tests/vm/accounts.sh"]

[binder]
apps = ["hello-binder-server", "hello-binder-client"]
run = ["python3 -u tests/vm/binder.py"]

[hub-services]
apps = ["hello-hub-server", "hello-hub-client"]
run = ["python3 -u tests/vm/hub-smoke.py", "python3 -u tests/vm/binder.py bound", "python3 -u tests/vm/binder.py auto"]

[providers]
apps = ["hello-cp-provider", "hello-cp-client", "hello-cp-denied"]
run = ["python3 -u tests/vm/hub.py providers basic", "python3 -u tests/vm/hub.py providers denied", "python3 -u tests/vm/hub.py providers death",
       "python3 -u tests/vm/hub.py providers idle"]

[services]
apps = ["hello-svc-target", "hello-svc-caller", "hello-svc-late"]  # hello-svc-late: installed again by the late phase while a host runs
run = ["python3 -u tests/vm/hub.py services start", "python3 -u tests/vm/hub.py services selfstop", "python3 -u tests/vm/hub.py services sticky",
       "python3 -u tests/vm/hub.py services private", "python3 -u tests/vm/hub.py services filters", "python3 -u tests/vm/hub.py services own",
       "python3 -u tests/vm/hub.py services late", "python3 -u tests/vm/hub.py services oneway", "python3 -u tests/vm/hub.py services respawn",
       "python3 -u tests/vm/hub.py services rebind", "python3 -u tests/vm/hub.py services framework", "python3 -u tests/vm/hub.py services stoplock"]

[sharedlib]
# <uses-library> and the implicit libraries by target SDK (HostSharedLibraries); hello-sharedlib carries hello-sharedlib-missing (install refuses it)
apps = ["hello-sharedlib", "hello-sharedlib-old"]
run = ["tests/vm/sharedlib.sh"]

[installer]
apps = ["hello-installer", "hello-legacy-receiver"]  # hello-installer carries the payload APKs (hello-payload with config and ABI splits, hello-payload2, hello-payload-other, hello-installer2) as assets
run = ["python3 -u tests/vm/installer.py"]

[activities]
apps = ["hello-act-target", "hello-act-caller"]
run = ["python3 -u tests/vm/hub.py activities result", "python3 -u tests/vm/hub.py activities explicit", "python3 -u tests/vm/hub.py activities again",
       "python3 -u tests/vm/hub.py activities private", "python3 -u tests/vm/hub.py activities up", "python3 -u tests/vm/relaunch.py"]

[pendingintents]
apps = ["hello-pi-holder", "hello-pi-creator", "hello-act-target", "hello-svc-target"]
run = ["python3 -u tests/vm/hub.py pendingintents broadcast", "python3 -u tests/vm/hub.py pendingintents targets", "python3 -u tests/vm/hub.py pendingintents cancel", "python3 -u tests/vm/hub.py pendingintents forresult"]

[notifications]
apps = ["hello-nt-poster"]
run = ["python3 -u tests/vm/hub.py notifications click", "python3 -u tests/vm/hub.py notifications cancel", "python3 -u tests/vm/hub.py notifications muted", "python3 -u tests/vm/hub.py notifications channels"]

[broadcasts]
apps = ["hello-bc-receiver", "hello-bc-sender", "hello-bc-denied"]
run = ["python3 -u tests/vm/broadcasts.py manifest", "python3 -u tests/vm/broadcasts.py basic", "python3 -u tests/vm/broadcasts.py ordered",
       "python3 -u tests/vm/broadcasts.py sticky", "python3 -u tests/vm/broadcasts.py async", "python3 -u tests/vm/broadcasts.py once",
       "python3 -u tests/vm/broadcasts.py death"]

[units]
# out of the starter's lifecycle (Lomiri freezes an app's unit when it loses the focus): a launch from a unit frozen meanwhile comes up, every process in apklayer's own units, the spare serves another app
apps = ["hello-act-target", "hello-act-caller"]
run = ["python3 -u tests/vm/units.py"]

[push]
# background push: a closed app wakes for a cloud message, an alarm and a job fire with no app process, boot broadcasts, always-on mode (HubScheduler, HubBootBroadcasts)
apps = ["hello-push", "hello-pushgms"]
run = ["python3 -u tests/vm/push.py push", "python3 -u tests/vm/push.py alarm", "python3 -u tests/vm/push.py job", "python3 -u tests/vm/push.py jobs",
       "python3 -u tests/vm/push.py retry", "python3 -u tests/vm/push.py boot",
       "python3 -u tests/vm/push.py autostart"]

[push-microg]
# microG's real push connection (needs the network): with no app open an always-on instance's microG checks in and McsService logs in to mtalk.google.com, and again after the connection drops
apps = ["hello-push"]
needs = ["com.google.android.gms"]
run = ["python3 -u tests/vm/push.py mcs"]

[webview]
apps = ["hello-wvprobe"]
needs = ["com.android.webview"]  # tools/host-setup/webview.sh <the provider APK>, in the data home the runner uses
run = ["python3 -u tests/vm/hub.py webview probe"]

[webview-input]
apps = ["hello-wvprobe"]
needs = ["com.android.webview"]
run = ["python3 -u tests/vm/webview-input.py"]

[splash]
needs = ["com.android.test.uibench"]
run = ["python3 -u tests/vm/splash.py"]

[window-geometry]
needs = ["com.android.test.uibench"]
run = ["python3 -u tests/vm/window-geometry.py"]

[decoration]
# server-side title bars under sway (headless, its own socket): needs sway on the VM
needs = ["com.android.test.uibench"]
optional = true
run = ["python3 -u tests/vm/decoration.py"]

[mobile]  # also the hub's questions as full-screen pages in the mobile style (permission-mobile.py)
needs = ["com.android.test.uibench"]
apps = ["hello-permissions"]
run = ["python3 -u tests/vm/mobile.py", "python3 -u tests/vm/permission-mobile.py"]

[startup]
needs = ["com.android.test.uibench"]
run = ["tests/vm/startup.sh com.android.test.uibench", "tests/vm/asset-cache.sh com.android.test.uibench"]

[gpu]
apps = ["hello-hwbitmap"]
needs = ["com.android.test.uibench"]
# the second run under a decimal-comma locale: Android's native float parsing (VectorDrawable paths, PathInterpolator) must stay in C
setup = ["locale -a | grep -qx nl_NL.utf8 || sudo -n locale-gen nl_NL.UTF-8 >/dev/null"]
run = ["python3 -u tests/vm/gpu-smoke.py", "LANG=nl_NL.UTF-8 LC_ALL=nl_NL.UTF-8 python3 -u tests/vm/gpu-smoke.py", "python3 -u tests/vm/hwbitmap.py"]

[gpu-select]
# apklayer gpus / gpu set|unset and the node the instance's processes get (no app: rendering on a choice is gpu/gpu-window with APKLAYER_GPU)
run = ["python3 -u tests/vm/gpu-select.py"]

[gpu-window]
needs = ["com.android.test.uibench"]
run = ["python3 -u tests/vm/gpu-window-run.py"]

[fences]
# every fence a real sync_file: no "sync_file_info returned NULL" / "Invalid present fence" in an app's or SurfaceFlinger's log (glbench window)
apps = ["hello-glbench"]
run = ["python3 -u tests/vm/fences.py"]

[window-formats]
# 10-bit and half-float EGL window configs (AR30, XR30, AB4H, XB4H) reach the screen: screenshots during glbench's clear scene
apps = ["hello-glbench"]
run = ["python3 -u tests/vm/window-formats.py"]

[texture-view]
needs = ["com.android.test.uibench"]
run = ["python3 -u tests/vm/texture-view.py"]

[vulkan]
# alone: beside other groups it stalls them and itself (one host GPU: Venus)
apps = ["hello-vulkan"]
alone = true
run = ["python3 -u tests/vm/vulkan.py"]

[vulkan-present]
apps = ["hello-vulkan"]
run = ["python3 -u tests/vm/vulkan-present.py"]

[godot]
# the Godot 4 Android editor (godot-builds' android_editor.apk, installed by hand) runs a Mobile-renderer (Vulkan) scene; needs Vulkan presentation
needs = ["org.godotengine.editor.v4"]
run = ["python3 -u tests/vm/godot-vulkan.py"]

[input]
apps = ["hello-input", "hello-system"]  # hello.system's Ime: the Android input method bound to hello.input's field (ime-bind)
run = ["python3 -u tests/vm/input-inject.py", "python3 -u tests/vm/stopped-windows.py", "python3 -u tests/vm/alt-ime.py", "python3 -u tests/vm/ime-bind.py", "python3 -u tests/vm/bottom-sheet.py", "python3 -u tests/vm/logs.py"]

[magnifier]
apps = ["hello-input"]
run = ["tests/vm/magnifier.sh"]

[input-desktop]
apps = ["hello-input"]
alone = true
run = ["python3 -u tests/vm/input.py"]

[multi-app]
apps = ["hello-share-dst", "hello-share-dst2"]
run = ["python3 -u tests/vm/multi-app.py"]

[portal]
apps = ["hello-portal"]
run = ["tests/vm/portal.sh"]

[codec2]
alone = true
run = ["tests/vm/codec2.sh"]

[native-surface]
apps = ["hello-native-surface"]
setup = ["rm -f ${APKLAYER_NATIVE:-$HOME/arm64-native}/android-root/vendor/etc/vintf/manifest/apklayer-*.xml", "N=${APKLAYER_NATIVE:-$HOME/arm64-native}/android-root; mkdir -p $N/vendor/etc $N/system/lib64 && cp -a --remove-destination bridge/native/android-root/system/lib64/extractors $N/system/lib64/ && cp --remove-destination bridge/native/android-root/vendor/etc/media_codecs.xml $N/vendor/etc/"]
alone = true
run = ["python3 -u tests/vm/native-surface.py"]

[native-media]
apps = ["hello-native-codec"]
setup = ["rm -f ${APKLAYER_NATIVE:-$HOME/arm64-native}/android-root/vendor/etc/vintf/manifest/apklayer-*.xml", "N=${APKLAYER_NATIVE:-$HOME/arm64-native}/android-root; mkdir -p $N/vendor/etc $N/system/lib64 && cp -a --remove-destination bridge/native/android-root/system/lib64/extractors $N/system/lib64/ && cp --remove-destination bridge/native/android-root/vendor/etc/media_codecs.xml $N/vendor/etc/"]
alone = true
run = ["python3 -u tests/vm/native-media.py"]

[native-player]
apps = ["hello-native-player"]
setup = ["rm -f ${APKLAYER_NATIVE:-$HOME/arm64-native}/android-root/vendor/etc/vintf/manifest/apklayer-*.xml", "N=${APKLAYER_NATIVE:-$HOME/arm64-native}/android-root; mkdir -p $N/vendor/etc $N/system/lib64 && cp -a --remove-destination bridge/native/android-root/system/lib64/extractors $N/system/lib64/ && cp --remove-destination bridge/native/android-root/vendor/etc/media_codecs.xml $N/vendor/etc/"]
alone = true
run = ["python3 -u tests/vm/native-player.py"]

[native-audio]
apps = ["hello-native-audio"]
alone = true
run = ["python3 -u tests/vm/native-audio.py"]

[audio-late-install]
apps = ["hello-native-audio"]
alone = true
run = ["python3 -u tests/vm/native-audio.py late"]

[audio-aidl]
alone = true
run = ["tests/vm/audio-host.sh aidl"]

[audio-track]
alone = true
run = ["tests/vm/audio-host.sh system"]

[audio-system]
alone = true
run = ["tests/vm/audio-system.sh"]

[audio-silent]
# no sound server for the instance: the HAL's silent output takes the original AudioTrack's PCM at real time (docs/PLAN.md, audio)
alone = true
run = ["python3 -u tests/vm/audio-silent.py", "python3 tests/lib/instance.py clean"]

[openttd-silent]
# OpenTTD (SDL 1.2) without a sound server, then a focus loss (docs/PLAN.md, graphics): OPENTTD_APK (APKLY_VM_ENV) names its APK on the host
optional = true
alone = true
run = ["python3 -u tests/vm/openttd-silent.py", "python3 tests/lib/instance.py clean"]

[otr2]
# alone: its GPU load stalls gpu-window beside it (virgl)
needs = ["com.dogbytegames.otrnext"]
alone = true
run = ["python3 -u tests/vm/otr2-run.py"]

[otr2-input]
# pointer input of a GameActivity game: tap and click select portraits at scales 100 and 200, also after a drag resize, maximize and restore
needs = ["com.dogbytegames.otrnext"]
alone = true
run = ["python3 -u tests/vm/otr2-input.py"]

[corpus]
optional = true
alone = true
mac = ["python3 tests/corpus/run.py"]

[fennec]
optional = true  # its page-text check fails on virgl hosts (ints set in shader branches come back as NaN: tests/vm/gles-int-branch.c)
needs = ["org.mozilla.fennec_fdroid"]
run = ["tests/vm/fennec.sh"]

[fennec-media]
optional = true  # YouTube needs the network
needs = ["org.mozilla.fennec_fdroid"]
# local WebM/MP4 (a fresh install's first start included), YouTube's embedded player, an m.youtube.com watch page (Big Buck Bunny, past the consent page)
run = ["tests/vm/fennec-media.sh", "YOUTUBE=jNQXAC9IVRw tests/vm/fennec-media.sh", "WATCH=aqz-KE-bpKQ tests/vm/fennec-media.sh"]

[newpipe-media]
optional = true  # needs the network (YouTube)
needs = ["org.schabi.newpipe"]
run = ["tests/vm/newpipe-media.sh"]

[sandbox]
optional = true  # needs tools/host-setup/sandbox.sh once (uidmap, subordinate ids, the AppArmor profile, render nodes)
apps = ["hello-sandbox"]
run = ["tests/vm/sandbox.sh"]

[otr2-probe]
# the same with the window scale changed while the game runs (100 -> 200 -> 100 %), tap and click
needs = ["com.dogbytegames.otrnext"]
alone = true
run = ["python3 -u tests/vm/otr2-input.py scale"]

[otr2-aspect]
# the same in windows of other shapes than the game's 16:9 (600x1000, 1600x500, 900x850, 1137x613) after drag resizes, at 100 and 200 %: the
