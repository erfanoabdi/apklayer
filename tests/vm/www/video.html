<html><head><meta name="viewport" content="width=device-width"></head><body style="background:#fff;margin:0">
<script>
// ?src=a.webm,b.mp4&muted=1,0: one autoplaying looped <video> per file; each reports its state as a GET beacon (/r?src=..) once a second.
var q = new URLSearchParams(location.search), muted = (q.get('muted') || '').split(',');
(q.get('src') || '').split(',').forEach(function(src, i) {
  var v = document.createElement('video'), ev = [];
  v.autoplay = v.loop = true; v.muted = muted[i] !== '0'; v.style = 'width:48%;margin:1%'; v.src = src;
  document.body.appendChild(v);
  ['loadedmetadata', 'playing', 'error', 'stalled', 'waiting'].forEach(function(e) { v.addEventListener(e, function() { ev.push(e); }); });
  v.play().catch(function(e) { ev.push('play-rejected:' + e.name); });
  setInterval(function() {
    var e = v.error, p = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : {};
    new Image().src = '/r?src=' + src + '&t=' + v.currentTime.toFixed(2) + '&w=' + v.videoWidth + '&h=' + v.videoHeight + '&rs=' + v.readyState +
      '&paused=' + v.paused + '&muted=' + v.muted + '&err=' + (e ? e.code + ':' + encodeURIComponent(e.message) : '') +
      '&frames=' + (p.totalVideoFrames || 0) + '&dropped=' + (p.droppedVideoFrames || 0) + '&ev=' + ev.join(',') + '&n=' + Math.random();
  }, 1000);
});
</script></body></html>
