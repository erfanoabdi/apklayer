# The apklayer Flatpak (docs/INSTALL.md "Flatpak"): the deb's Meson build (debian/rules) with prefix /app, the manager as the app's command,
# the CLI as `flatpak run --command=apklayer io.github.erfanoabdi.Apklayer`. Like the deb it has no Android half: `apklayer setup` (the manager's
# first run) downloads the per-user runtime bundle into ~/.var/app/io.github.erfanoabdi.Apklayer/data/apklayer/runtime.
# Build: sh flatpak/build.sh <joined prebuilts checkout> <out dir> (it links flatpak/prebuilts to the checkout).
app-id: io.github.erfanoabdi.Apklayer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: apklayer-manager
finish-args:
  # windows: apklayer's shell and the manager are Wayland clients only
  - --socket=wayland
  - --share=ipc
  # apps' internet, and `apklayer setup`'s downloads
  - --share=network
  # the GPU's render nodes. Binder is the userspace one (cli/binder.cpp: no /dev/binderfs here), input comes through Wayland, cameras through
  # PipeWire. Not here: USB devices (apklayer usb) and the force-feedback vibrator's /dev/input (--device=usb/input need Flatpak 1.16, Ubuntu
  # 24.04 has 1.14); `flatpak override --user --device=all` gives them and the host's binderfs (docs/INSTALL.md "Flatpak")
  - --device=dri
  # audio: the PulseAudio backend through the pulse socket, the PipeWire backend through PipeWire's own
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # Bluetooth (BlueZ, AF_BLUETOOTH sockets), location (GeoClue), notifications
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.GeoClue2
  - --talk-name=org.freedesktop.Notifications
  # the JDK apps run on (the openjdk21 extension's JRE, installed into /app/jre)
  - --env=APKLAYER_NATIVE_JAVA=/app/jre/bin/java
build-options:
  append-path: /usr/lib/sdk/openjdk21/bin
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  # bionic_translation's libbsd (the 26.08 SDK has neither); the same releases as rpm/sources
  - name: libmd
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libmd-1.1.0.tar.xz
        sha256: 1bd6aa42275313af3141c7cf2e5b964e8b1fd488025caf2f971f43b00776b332
    cleanup: [/include, /lib/pkgconfig, '*.a', '*.la', /share/man]

  - name: libbsd
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libbsd-0.12.2.tar.xz
        sha256: b88cc9163d0c652aaf39a99991d974ddba1c3a9711db8f1b5838af2a14731014
    cleanup: [/include, /lib/pkgconfig, '*.a', '*.la', /share/man]

  # libinput.so.10 for the manager's prebuilt Slint (manager/fetch-slint.sh; its linuxkms backend links it), with its mtdev and libevdev
  - name: mtdev
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://bitmath.org/code/mtdev/mtdev-1.1.7.tar.bz2
        sha256: a107adad2101fecac54ac7f9f0e0a0dd155d954193da55c2340c97f2ff1d814e
    cleanup: [/bin, /include, /lib/pkgconfig, '*.la']

  - name: libevdev
    buildsystem: meson
    config-opts: [--libdir=lib, -Dtests=disabled, -Ddocumentation=disabled, -Dtools=disabled]
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/libevdev/libevdev-1.13.4.tar.xz
        sha256: f00ab8d42ad8b905296fab67e13b871f1a424839331516642100f82ad88127cd
    cleanup: [/bin, /include, /lib/pkgconfig]

  - name: libinput
    buildsystem: meson
    config-opts: [--libdir=lib, -Dlibwacom=false, -Ddebug-gui=false, -Dtests=false, -Ddocumentation=false, -Dinstall-tests=false]
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.28.1/libinput-1.28.1.tar.gz
        sha256: a13f8c9a7d93df3c85c66afd135f0296701d8d32f911991b7aa4273fdd6a42a3
    cleanup: [/bin, /include, /lib/pkgconfig, /libexec, /share/man, /share/zsh, /etc]

  - name: apklayer
    buildsystem: meson
    builddir: true
    config-opts:
      - -Dprebuilts=/run/build/apklayer/flatpak/prebuilts
      - -Dandroid_runtime=false
    build-options:
      env:
        APKLAYER_DEPS_LOCAL: /run/build/apklayer/flatpak-deps  # tools/gen/fetch-dep.py: deps.lock's artifacts, the sources below
    sources:
      - type: dir
        path: ..
        skip: [b, inst, .flatpak-builder, flatpak/prebuilts, flatpak/build, subprojects/bionic_translation]
      - type: dir
        path: prebuilts
        dest: flatpak/prebuilts
      # the build has no network: bionic_translation's wrap (subprojects/bionic_translation.wrap), deps.lock (tools/gen/flatpak-sources.py
      # writes deps-sources.json from it) and manager/fetch-slint.sh's downloads (it finds them in slint/ and checks their hashes) are pinned here
      - type: git
        url: https://gitlab.com/android_translation_layer/bionic_translation
        commit: 6253dec7f24a57a94039a088cb436d880e92e3be
        dest: subprojects/bionic_translation
      - deps-sources.json
      - type: file
        only-arches: [aarch64]
        url: https://github.com/slint-ui/slint/releases/download/v1.18.1/Slint-cpp-1.18.1-Linux-arm64.tar.gz
        sha256: 810cfed786c3f63aea9c1b73371a02ed591129d18e077094afa9e024e2d714fd
        dest: slint
      - type: file
        only-arches: [aarch64]
        url: https://github.com/slint-ui/slint/releases/download/v1.18.1/slint-compiler-Linux-aarch64.tar.gz
        sha256: 6d704012132ec8c8fadddefb86ba192cd83e09048edbcf61aee457aca300c78c
        dest: slint
      - type: file
        only-arches: [x86_64]
        url: https://github.com/slint-ui/slint/releases/download/v1.18.1/Slint-cpp-1.18.1-Linux-x86_64.tar.gz
        sha256: f0b24ea601b80afe241677d1179bf5215dceae529f2b275b678a0af9a144b255
        dest: slint
      - type: file
        only-arches: [x86_64]
        url: https://github.com/slint-ui/slint/releases/download/v1.18.1/slint-compiler-Linux-x86_64.tar.gz
        sha256: 543091e6102a02db3403aa77c774a11d9f383b31cb03e25cddad63269a1fb779
        dest: slint
      - type: file
        url: https://material.slint.dev/zip/material-1.1.0.zip
        sha256: 83c57b6f1b8799ddacd94b7e8b140f3f2112c36407b6df31883da0ba4e2dd425
        dest: slint
    # post-install runs in the build directory (builddir: true), the sources one level up
    post-install:
      - install -Dm644 ../data/apklayer.svg /app/share/icons/hicolor/scalable/apps/io.github.erfanoabdi.Apklayer.svg
      - install -Dm644 ../data/apklayer-256.png /app/share/icons/hicolor/256x256/apps/io.github.erfanoabdi.Apklayer.png
      - install -Dm644 ../flatpak/io.github.erfanoabdi.Apklayer.metainfo.xml -t /app/share/metainfo
      # the manager's entry under the app id (Flatpak exports only files named after it), which also opens .apk files (`apklayer run`, as the
      # deb's apklayer-open-apk entry); the deb's other entries are not exported
      - sed -e 's/^Icon=.*/Icon=io.github.erfanoabdi.Apklayer/' -e 's/^Exec=apklayer-manager$/Exec=apklayer-manager %f/' -e '$a MimeType=application/vnd.android.package-archive;'
        ../data/apklayer-manager.desktop > /app/share/applications/io.github.erfanoabdi.Apklayer.desktop
      - rm /app/share/applications/apklayer-manager.desktop /app/share/applications/apklayer-share.desktop
      # the manager (debian/rules' second build)
      - cd .. && sh manager/fetch-slint.sh $PWD/slint
      - cd .. && meson setup manager/b manager --prefix=/app -Dlibdir=lib/apklayer -Dslint=$PWD/slint
      - cd .. && ninja -C manager/b apklayer-manager && meson install -C manager/b --no-rebuild
